name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/node_api_app .

      - name: Push Docker Image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/node_api_app

      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "=== Starting Application Deployment ==="
            
            # 1. Stop and remove the old container if it exists to avoid port conflicts
            sudo docker stop my-api-container || true
            sudo docker rm my-api-container || true
            
            # 2. Navigate to your project directory (adjust this path to where your code lives on EC2)
            cd /home/ec2-user/your-project-folder
            
            # 3. Pull the latest changes from Git (if you pull code directly on the server)
            git pull origin main
            
            # 4. Build the new Docker image
            sudo docker build -t my-api-image .
            
            # 5. Run the container in the background (-d) and map the ports (-p)
            # Change 8080:8080 to match your API's host port and internal port
            sudo docker run -d -p 8080:8080 --name my-api-container my-api-image
            
            # 6. Verify it stayed alive
            echo "=== Checking Running Containers ==="
            sudo docker ps
